services:
  falkordb:
    image: falkordb/falkordb@sha256:b0bdcac2cbaff989e77cb0610439b7a9289e86de033ccbbd4368b66fb680ae7a
    ports:
      - "127.0.0.1:16379:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
volumes:
  falkordb-data:
