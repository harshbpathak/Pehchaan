[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pehchan-ai"
version = "0.1.0"
description = "Provenance-preserving ClaimReview ingestion and FalkorDB investigation foundation"
requires-python = ">=3.11"
dependencies = ["falkordb>=1.2,<2", "ijson>=3.3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
pehchan = "pehchan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live FalkorDB server"]

[tool.ruff]
line-length = 100
